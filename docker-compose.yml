services:
  # -------------------------------------------------------------
  # MySQL Database Service
  # -------------------------------------------------------------
  careslot-mysql:
    image: mysql:8.0
    container_name: careslot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-careslot_db}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:${DB_EXTERNAL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - careslot-network

  # -------------------------------------------------------------
  # Redis Cache Service
  # -------------------------------------------------------------
  careslot-redis:
    image: redis:7-alpine
    container_name: careslot-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - careslot-network

  # -------------------------------------------------------------
  # Spring Boot Backend Service
  # -------------------------------------------------------------
  careslot-backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: careslot-backend:latest
    container_name: careslot-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      careslot-mysql:
        condition: service_healthy
      careslot-redis:
        condition: service_healthy
    environment:
      # Database connection
      SPRING_DATASOURCE_URL: jdbc:mysql://careslot-mysql:3306/${DB_NAME:-careslot_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-root}

      # Redis connection
      REDIS_HOST: careslot-redis
      REDIS_PORT: 6379

      # App & CORS configuration
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}

      # Security & JWT
      JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Lax}

      # Mail configuration
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}

      # VNPay configuration
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-AS09APAU}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-BZKK4YZW5D75KC87AWRN75YN0FR2DD52}
      VNPAY_PAY_URL: ${VNPAY_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:5173/payment/vnpay-callback}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8080/api/v1/payments/vnpay-ipn}
      VNPAY_HOLD_TIMEOUT_MINUTES: ${VNPAY_HOLD_TIMEOUT_MINUTES:-10}

      # Gemini AI configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      # AWS S3 configuration
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-careslot-images-dev}

      # JVM Performance Tuning
      JAVA_OPTS: "-XX:+UseG1GC -XX:MaxRAMPercentage=75.0"
    networks:
      - careslot-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

networks:
  careslot-network:
    driver: bridge
